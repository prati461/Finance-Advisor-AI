services:
  # MySQL Private Service on Render with Persistent Disk
  - type: pserv
    name: render-mysql
    runtime: image
    image:
      url: mysql:8.4
    envVars:
      - key: MYSQL_DATABASE
        value: railway
      - key: MYSQL_USER
        value: mysql
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  # FastAPI Backend Web Service
  - type: web
    name: finance-advisor-ai-1
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://finance-advisor-ai.vercel.app
      - key: MYSQL_HOST
        value: render-mysql
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        value: mysql
      - key: MYSQL_DATABASE
        value: railway
      - key: MYSQL_PASSWORD
        fromService:
          type: pserv
          name: render-mysql
          envVarKey: MYSQL_PASSWORD
