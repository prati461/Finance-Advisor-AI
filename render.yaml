databases:
  - name: finance-advisor-db
    databaseName: finance_advisor
    user: finance
    plan: free

services:
  - type: web
    name: finance-advisor-ai-1
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://finance-advisor-ai.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: finance-advisor-db
          property: connectionString
