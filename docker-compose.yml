services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-advisor-backend
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://finance:finance@db:3306/finance_advisor
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - .:/app:delegated
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: finance
      MYSQL_PASSWORD: finance
      MYSQL_DATABASE: finance_advisor
      MYSQL_ROOT_PASSWORD: local-development-only
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "finance", "-pfinance"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
